[project]
name = "stockfollower"
version = "0.1.0"
description = "Taiwan stock research CLI"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.0.0", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stockfollower"]

[project.scripts]
stockfollower = "stockfollower.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
