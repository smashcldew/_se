services:
  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:8080"
    depends_on:
      node:
        condition: service_started
      python:
        condition: service_started
      rust:
        condition: service_started
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  node:
    build:
      context: ./node
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: docker_demo
      PGUSER: demo
      PGPASSWORD: demo_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5

  python:
    build:
      context: ./python
    environment:
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: docker_demo
      PGUSER: demo
      PGPASSWORD: demo_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5

  rust:
    build:
      context: ./rust
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docker_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d docker_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
